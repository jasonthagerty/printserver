# printserver cupsd.conf. Everyone on the network may print, see the queue
# and cancel jobs: the house is the trust boundary (see README). Queue
# administration and operations on other people's documents (holding,
# fetching, moving, purging) are local-only.
LogLevel warn
MaxLogSize 0
# No "ServerAlias *": cupsd checks the Host header, which stops DNS
# rebinding. It accepts IP addresses, localhost and .local names itself;
# init-printserver adds PRINTSERVER_ALLOWED_HOSTS below this line.
ServerName printserver.local
Listen *:631
Listen /run/cups/cups.sock
# The Go server publishes the AirPrint record itself (internal/airprint), so
# its "printer webpage" link can point at the web UI.
Browsing No
BrowseLocalProtocols none
DefaultShared Yes
WebInterface No
DefaultEncryption IfRequested
MaxJobs 200
PreserveJobHistory 1d
PreserveJobFiles No

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none

  <Limit CUPS-Get-Document CUPS-Move-Job Purge-Jobs Hold-Job Release-Job Restart-Job Set-Job-Attributes Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Close-Job Cancel-Job Cancel-My-Jobs CUPS-Authenticate-Job Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications>
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
